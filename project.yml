name: Taki
options:
  bundleIdPrefix: com.davidfromkansas
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  TakiKit:
    path: Packages/TakiKit
  TakiMac:
    path: Packages/TakiMac
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
targets:
  Taki:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["**/*.md"]
      - path: Shared
    dependencies:
      - package: TakiKit
        product: TakiCore
      - package: TakiKit
        product: TakiEngine
      - target: TakiKeyboard
        embed: true
    entitlements:
      path: Config/Taki.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TAKI_APP_GROUP)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(TAKI_BUNDLE_ID)
        PRODUCT_NAME: Taki
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taki
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Taki listens only while you dictate. Speech is turned into text on this iPhone and never leaves it.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "debug-feed.wav"
    info:
      path: App/Info.plist
      properties:
        TakiAppGroup: $(TAKI_APP_GROUP)
        UIBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: $(TAKI_BUNDLE_ID)
            CFBundleURLSchemes: [taki]
  TakiKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Shared
    dependencies:
      - package: TakiKit
        product: TakiCore
    entitlements:
      path: Config/TakiKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TAKI_APP_GROUP)
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: $(TAKI_KEYBOARD_BUNDLE_ID)
        PRODUCT_NAME: TakiKeyboard
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taki
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: Taki
        TakiAppGroup: $(TAKI_APP_GROUP)
        CADisableMinimumFrameDurationOnPhone: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
  TakiMac:
    type: application
    platform: macOS
    sources:
      - path: Mac
      - path: Keyboard/OrbRenderer.swift
      - path: Keyboard/OrbTuning.swift
      - path: Keyboard/Orb.metal
    dependencies:
      - package: TakiKit
        product: TakiCore
      - package: TakiMac
        product: TakiMacEngine
      - package: Sparkle
    entitlements:
      path: Config/TakiMac.entitlements
      properties:
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TAKI_BUNDLE_ID).mac
        PRODUCT_NAME: Taki
        TARGETED_DEVICE_FAMILY: ""
        # Apple silicon only: MLX/speech-swift use Float16, which doesn't build for Intel.
        ARCHS: arm64
        MARKETING_VERSION: $(TAKI_MAC_VERSION)
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taki
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Taki listens only while you hold the talk key. Speech is turned into text on this Mac and never leaves it.
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: BenchCommand.swift
    info:
      path: Mac/Info.plist
      properties:
        # Sparkle auto-updates: the appcast is uploaded to every GitHub Release (scripts/release-mac.sh).
        SUFeedURL: $(TAKI_MAC_APPCAST_URL)
        SUPublicEDKey: $(TAKI_SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUVerifyUpdateBeforeExtraction: true
  TakiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TakiTests
    dependencies:
      - target: Taki
      - package: TakiKit
        product: TakiCore
      - package: TakiKit
        product: TakiEngine
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TAKI_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Taki.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Taki
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
schemes:
  Taki:
    build:
      targets:
        Taki: all
        TakiKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TakiTests
        - package: TakiKit/TakiCoreTests
    archive:
      config: Release
  TakiMac:
    build:
      targets:
        TakiMac: all
    run:
      config: Debug
    archive:
      config: Release
